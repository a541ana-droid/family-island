/* G-19 loading art + parade, G-01 build stamp. Runs before the engine script so the picture shows at once. */
const FI_BUILD = {"time": 1792450042, "commit": "43db092", "build": "f7d5b0cb5fbb"};
(function () {
	const loader = document.getElementById('loader');
	const art = document.getElementById('art');
	const parade = document.getElementById('parade');
	let iw = 0, ih = 0, scale = 1;
	/* Whole device pixels per art pixel: the cover scale rounded DOWN when that still fills at least 90 % of the
	   screen (the gap shows the picture's own sky / sand colour), else rounded up (a little is cropped). */
	function fitArt() {
		if (!iw) return;
		const dpr = window.devicePixelRatio || 1;
		const W = window.innerWidth * dpr, H = window.innerHeight * dpr;
		const c = Math.max(W / iw, H / ih);

		scale = s;

		art.style.height = (ih * s / dpr) + 'px';
		art.style.left = (Math.round((W - iw * s) / 2) / dpr) + 'px';
		art.style.top = (Math.round((H - ih * s) / 2) / dpr) + 'px';
		// feet on the beach: 93 % down the hi-res picture (its bottom sixth is an empty sand strip), never below the screen
		const feet = Math.min((H - ih * s) / 2 + ih * s * (iw >= 960 ? 0.93 : 0.97), H - 8 * dpr);
		parade.style.top = (Math.round(feet) / dpr) + 'px';
		buildParade(s * (iw >= 960 ? 2 : 1) / dpr);   // one game pixel = 2 art pixels of the 960-wide picture
	}
	/* sheet: url, cell px, row, frames, flip (sheets whose side row faces the wrong way) */
	const TROOP = [
		{ src: 'icons/walk_girl.png', cell: 64, row: 5, n: 4, fps: 6, flip: false, gap: 0 },
		{ src: 'icons/walk_boy.png', cell: 64, row: 5, n: 4, fps: 6, flip: false, gap: 22 },
		{ src: 'icons/walk_dog.png', cell: 32, row: 1, n: 3, from: 1, fps: 7, flip: false, gap: 26, lift: 2 },
		{ src: 'icons/walk_chicken.png', cell: 16, row: 1, n: 3, from: 1, fps: 7, flip: false, gap: 40, lift: 1 },
		{ src: 'icons/walk_chick.png', cell: 16, row: 1, n: 3, from: 1, fps: 8, flip: false, gap: 12, lift: 1 },
	];
	let builtFor = 0;
	function buildParade(px) {
		if (px === builtFor) return;
		builtFor = px;
		parade.innerHTML = '';
		const troop = document.createElement('div');
		troop.className = 'troop';
		let x = 0;
		const css = [];
		TROOP.forEach(function (t, i) {
			x += t.gap * px;
			const d = document.createElement('div');
			const w = t.cell * px, from = (t.from || 0) * w;
			d.className = 'walker' + (t.flip ? ' flip' : '');
			d.style.width = w + 'px';
			d.style.height = t.cell * px + 'px';
			d.style.left = x + 'px';
			d.style.bottom = (-(t.cell === 64 ? 8 : t.lift || 0) * px) + 'px';   // 64-cells: feet at y=56
			d.style.backgroundImage = 'url(' + t.src + ')';
			d.style.setProperty('--n', t.n);
			d.style.setProperty('--steps', 'fiw' + i + ' ' + (t.n / t.fps) + 's');
			const img = new Image();
			img.onload = function () {
				d.style.backgroundSize = (img.width * px) + 'px ' + (img.height * px) + 'px';
			};
			img.src = t.src;
			const y = -t.row * t.cell * px;
			css.push('@keyframes fiw' + i + ' { from { background-position: ' + (-from) + 'px ' + y + 'px; } to { background-position: ' + (-from - t.n * w) + 'px ' + y + 'px; } }');
			troop.appendChild(d);
			x += w;
		});
		troop.style.width = x + 'px';
		let st = document.getElementById('fiw-style');
		if (!st) { st = document.createElement('style'); st.id = 'fiw-style'; document.head.appendChild(st); }
		st.textContent = css.join('\n');
		parade.appendChild(troop);
	}
	function edgeColours(img) {
		try {
			const c = document.createElement('canvas'); c.width = 1; c.height = img.naturalHeight;
			const g = c.getContext('2d'); g.drawImage(img, 0, 0, 1, img.naturalHeight);
			const px = function (y) { const d = g.getImageData(0, y, 1, 1).data; return 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')'; };
			loader.style.setProperty('--art-top', px(1));
			loader.style.setProperty('--art-bottom', px(img.naturalHeight - 2));
		} catch (e) { /* tainted / no canvas: keep the defaults */ }
	}
	function show(src, fallback) {
		art.onload = function () {
			iw = art.naturalWidth; ih = art.naturalHeight;
			edgeColours(art);
			loader.classList.add('art');
			loader.querySelector('.bottom').style.display = '';
			fitArt();
		};
		art.onerror = function () { if (fallback) show(fallback, null); };
		art.src = src;
	}
	show('icons/loading_hd.png', 'icons/loading.png');
	window.addEventListener('resize', fitArt);
	/* the start button's wooden frame: 3 device pixels per art pixel of the 6 px corner, like the in-game buttons */
	function fitButton() { document.documentElement.style.setProperty('--bw', (6 * Math.max(2, Math.round(3 * (window.devicePixelRatio || 1))) / (window.devicePixelRatio || 1)) + 'px'); }
	fitButton();
	window.addEventListener('resize', fitButton);
	/* G-01: "نسخة ١٠ أكتوبر، ٣:٤٠ م" — the same stamp Settings shows inside the game */
	try {
		const b = document.getElementById('build');
		if (FI_BUILD && FI_BUILD.time) {
			const d = new Date(FI_BUILD.time * 1000);
			b.textContent = 'نسخة ' + d.toLocaleString('ar', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', hour12: true });
			b.title = FI_BUILD.build || '';
		}
	} catch (e) { /* no stamp in a dev export */ }
}());
</script>

	window.addEventListener('orientationchange', function () { setTimeout(fitCanvas, 300); });
	if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);

	/* Stop the browser from zooming / scrolling / showing callouts (iOS ignores user-scalable=no). */
	['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu'].forEach(function (ev) {
		document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
	});
	document.addEventListener('touchmove', function (e) { if (e.target === canvas || e.touches.length > 1) e.preventDefault(); }, { passive: false });
	let lastTouchEnd = 0;
	document.addEventListener('touchend', function (e) {
		const now = Date.now();
		if (now - lastTouchEnd < 350 && e.target !== canvas) e.preventDefault();   // double-tap zoom on the overlays
		lastTouchEnd = now;
	}, { passive: false });

	/* Save before the page goes away (tablet home button, app switch, tab close). */
	function onHidden() {
		if (typeof fiWeb.onHide === 'function') {
			try { fiWeb.onHide(); } catch (e) { console.error(e); }
			fiWeb.kickFrame();
		}
	}
	document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') onHidden(); });
	window.addEventListener('pagehide', onHidden);

	/* Service worker: offline play + IMMEDIATE updates (G-01). A new build's worker skips waiting and takes control;
	 * 'controllerchange' then reloads this page ONCE (saving first if the game is running). At launch we also ask
	 * the server for a newer worker before loading the engine, so a stale build is never started. */
	let started = false;
	let reloading = false;
	function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
	function reloadForUpdate() {
		if (reloading) return;
		reloading = true;
		console.log('[fi] new build took control -> reload');
		document.getElementById('updating').classList.add('on');
		if (started) {
			onHidden();                                       // save the island first (same path as closing the tab)
			setTimeout(function () { location.reload(); }, 900);
		} else {
			location.reload();
		}
	}
	fiWeb.build = (typeof FI_BUILD === 'object' && FI_BUILD) || {};
	async function setupServiceWorker() {
		if (!GODOT_CONFIG.serviceWorker || !('serviceWorker' in navigator) || !window.isSecureContext) return 'none';
		const sw = navigator.serviceWorker;
		let hadController = !!sw.controller;
		sw.addEventListener('controllerchange', function () {
			if (!hadController) { hadController = true; return; }   // first install claiming the page: nothing to swap
			reloadForUpdate();
		});
		let reg;
		try { reg = await sw.register(GODOT_CONFIG.serviceWorker, { updateViaCache: 'none' }); } catch (e) { console.warn('SW register failed', e); return 'none'; }
		fiWeb.swRegistration = reg;
		if (reg.waiting && sw.controller) reg.waiting.postMessage('update');   // a worker of an older build left waiting
		if (sw.controller) {
			// Is there a newer build on the server? (resolves once the check is done; a new worker is then installing)
			try { await Promise.race([reg.update(), sleep(5000)]); } catch (e) { /* offline: play the cached build */ }
			if (reg.installing || reg.waiting) {
				status.textContent = 'نُحدّث الجزيرة…';
				await sleep(30000);   // controllerchange reloads the page long before this
				return reloading ? 'reload' : 'ok';
			}
		} else {
			// First visit: wait (briefly) until the worker controls this page, so the big files we are
			// about to download go through it and are kept for offline play.
			await Promise.race([new Promise(function (r) { sw.addEventListener('controllerchange', r, { once: true }); }), sleep(5000)]);
		}
		// While playing: look for a new build when the page comes back and every 10 minutes.
		document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
		setInterval(function () { reg.update().catch(function () {}); }, 10 * 60 * 1000);
		return 'ok';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(missing.join('\n'));
		return;
	}

	const exe = GODOT_CONFIG.executable;
	const pack = GODOT_CONFIG.mainPack || (exe + '.pck');
	const engine = new Engine(Object.assign({}, GODOT_CONFIG, {
		onProgress: function (current, total) {
			if (loader.classList.contains('ready')) return;
			if (current > 0 && total > 0) {
				const p = Math.min(100, Math.round(current * 100 / total));
				bar.style.width = p + '%';
				status.textContent = 'نجهّز الجزيرة… ' + p.toLocaleString('ar') + '٪';
			}
		},
	}));
	fiWeb.engine = engine;

	setupServiceWorker().then(function (r) {
		if (r === 'reload') return;
		return Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(function () {
			bar.style.width = '100%';
			status.textContent = 'الجزيرة جاهزة!';
			loader.classList.add('ready');
			startBtn.focus();
		});
	}).catch(fail);

	startBtn.addEventListener('click', function () {
		if (started) return;
		started = true;
		status.textContent = '';
		// Starting inside the tap lets the browser create Godot's AudioContext unlocked.
		engine.start({ args: ['--main-pack', pack] }).then(function () {
			fitCanvas();
			canvas.focus();
			loader.classList.add('gone');
			setTimeout(function () { loader.remove(); }, 600);
			if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
		}, fail);
	});
}());
</script>
</body>
</html>
