<script>
/* Hotfix v1.0.1: keeps the last 30 console lines + errors in memory (hidden diagnostics view: tap the build stamp 5 times). */
(function () {
	const t0 = performance.now(), MAX = 30, all = [], errs = [];
	const D = window.fiDiag = { all: all, errs: errs, marks: {}, phase: 'loading', fatal: null, pending: [] };
	function fmt(a) {
		try {
			if (a instanceof Error) return a.name + ': ' + a.message + (a.stack ? ' | ' + String(a.stack).split('\n').slice(0, 3).join(' / ') : '');
			if (a && typeof a === 'object') return JSON.stringify(a);
			return String(a);
		} catch (e) { return '?'; }
	}
	function stamp() { return ((performance.now() - t0) / 1000).toFixed(1) + 's '; }
	function push(arr, level, text) {
		text = String(text); if (text.length > 400) text = text.slice(0, 400) + '…';
		arr.push(stamp() + level + ' ' + text); if (arr.length > MAX) arr.shift();
	}
	D.mark = function (name) { D.marks[name] = Math.round(performance.now() - t0); };
	D.log = function (level, text) { push(all, level, text); if (level === 'error' || level === 'warn') push(errs, level, text); };
	['log', 'info', 'warn', 'error', 'debug'].forEach(function (l) {
		const orig = console[l];
		console[l] = function () { try { D.log(l, Array.prototype.map.call(arguments, fmt).join(' ')); } catch (e) {} return orig.apply(console, arguments); };
	});
	function fatal(kind, detail) { if (D.fatal) D.fatal(kind, detail); else D.pending.push([kind, detail]); }
	window.addEventListener('error', function (e) {
		if (e.target && e.target !== window && (e.target.src || e.target.href)) { D.log('error', 'load failed: ' + (e.target.src || e.target.href)); return; }
		const m = (e.message || '') + (e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : '');
		D.log('error', 'uncaught: ' + m);
		if (D.phase === 'starting' || /RuntimeError|abort|out of memory|memory access|unreachable|WebAssembly/i.test(m)) fatal('error', m);
	}, true);
	window.addEventListener('unhandledrejection', function (e) {
		const m = fmt(e.reason);
		D.log('error', 'unhandledrejection: ' + m);
		if (D.phase === 'starting' || /RuntimeError|abort|out of memory|memory access|unreachable|WebAssembly/i.test(m)) fatal('error', m);
	});
	window.addEventListener('webglcontextlost', function (e) { D.log('error', 'WebGL context lost'); fatal('gl', 'webglcontextlost'); }, true);
	window.addEventListener('webglcontextcreationerror', function (e) { D.log('error', 'WebGL context creation failed: ' + (e.statusMessage || '')); fatal('gl', 'webglcontextcreationerror'); }, true);
	window.addEventListener('webglcontextrestored', function () { D.log('warn', 'WebGL context restored'); if (D.restored) D.restored(); }, true);
}());

<style>
:root {
	--sea: #9bd4c3;
	--sea-deep: #6fb8b0;
	--sand: #f2d9a0;
	--wood: #8a5a3b;
	--wood-dark: #6b4329;
	--leaf: #5aa152;
	--ink: #4a3426;
	--cream: #fff8e8;
	font-family: "SF Arabic Rounded", "SF Arabic", "Geeza Pro", "Almarai", "Noto Sans Arabic", "Noto Naskh Arabic", Tahoma, sans-serif;
}
html, body {
	margin: 0; padding: 0; border: 0;
	width: 100%; height: 100%;
	overflow: hidden;
	background: var(--sea);
	/* no pinch/double-tap zoom, no pull-to-refresh, no selection, no long-press callout */
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none; user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-text-size-adjust: 100%;
}
body { position: fixed; inset: 0; }
/* The game lives inside the safe area (notch, home indicator); the sea colour fills the rest. */
#stage {
	position: fixed;
	top: env(safe-area-inset-top, 0px);
	right: env(safe-area-inset-right, 0px);
	bottom: env(safe-area-inset-bottom, 0px);
	left: env(safe-area-inset-left, 0px);
}
#canvas { display: block; position: absolute; left: 0; top: 0; outline: none; }

/* ---------- loading screen ---------- */
#loader {
	position: fixed; inset: 0; z-index: 10;
	display: flex; flex-direction: column; align-items: center; justify-content: center;
	gap: min(3.2vh, 22px);
	background: linear-gradient(#bfe6dc 0%, var(--sea) 55%, var(--sea-deep) 100%);
	color: var(--ink);
	transition: opacity .45s ease;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#loader.gone { opacity: 0; pointer-events: none; }
/* G-19: the owner's illustration (icons/loading_hd.png 960x540, else icons/loading.png 480x270) drawn at a WHOLE
   number of device pixels per art pixel (fitArt() below), so it is never blurred or unevenly stretched; the strips the
   integer scale leaves free show the sky / sand colours of the picture itself. */
#loader.art { background: linear-gradient(var(--art-top, #8fd0f0) 50%, var(--art-bottom, #f4d396) 50%); justify-content: space-between; padding-top: max(6vh, env(safe-area-inset-top)); padding-bottom: max(5vh, env(safe-area-inset-bottom)); }
#loader.art .island, #loader.art .waves { display: none; }
#artwrap { position: absolute; inset: 0; overflow: hidden; z-index: -1; display: none; }
#loader.art #artwrap { display: block; }
#art { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; max-width: none; }
#loader.art #status { background: rgba(253, 236, 207, .92); border-radius: 10px; padding: 2px 12px; }
#loader.art .bottom { display: flex; flex-direction: column; align-items: center; gap: min(2vh, 14px); }
/* G-19: a little life — Lina, Sami and their animals walk along the beach (the owner's walk sheets, CSS steps()). */
#parade { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; }
.walker { position: absolute; bottom: 0; background-repeat: no-repeat; image-rendering: pixelated; image-rendering: crisp-edges;
	animation: var(--steps) steps(var(--n)) infinite; }
.walker.flip { transform: scaleX(-1); }
.troop { position: absolute; bottom: 0; left: 100%; animation: cross var(--cross, 26s) linear infinite; animation-delay: var(--delay, 0s); }
@keyframes cross { from { transform: translateX(0); } to { transform: translateX(calc(-100vw - 100%)); } }
@media (prefers-reduced-motion: reduce) { .troop, .walker { animation: none; } #parade { display: none; } }
#loader h1 { position: relative; }
#loader h1 {
	margin: 0; font-size: clamp(30px, 7vmin, 64px); font-weight: 800;
	color: var(--cream);
	text-shadow: 0 3px 0 var(--wood-dark), 0 6px 14px rgba(40, 70, 60, .35);
	letter-spacing: 0;
}
.island { position: relative; width: min(34vmin, 220px); height: min(20vmin, 130px); }
.island .sand { position: absolute; inset: 35% 0 0 0; background: var(--sand); border-radius: 50% 50% 46% 46%; box-shadow: 0 0 0 6px #e8f6ef; }
.island .grass { position: absolute; inset: 42% 18% 18% 18%; background: #7cc06a; border-radius: 50%; }
.island .trunk { position: absolute; left: 47%; width: 6%; top: 20%; height: 40%; background: var(--wood); border-radius: 3px; }
.island .leaves { position: absolute; left: 34%; width: 32%; top: 0; height: 42%; background: #3f8f4a; border-radius: 50%; animation: sway 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
.island .sun { position: absolute; right: -6%; top: -12%; width: 18%; aspect-ratio: 1; background: #ffd66b; border-radius: 50%; }
@keyframes sway { 50% { transform: rotate(4deg); } }
.waves { width: min(60vmin, 380px); height: 10px; background: radial-gradient(circle at 10px -4px, transparent 9px, #e8f6ef 10px, transparent 11px) 0 0 / 20px 10px repeat-x; opacity: .8; animation: drift 3s linear infinite; }
@keyframes drift { to { background-position: -20px 0; } }
#bar {
	width: min(60vmin, 380px); height: 22px; box-sizing: border-box;
	border: 4px solid var(--wood-dark); border-radius: 14px; background: var(--cream); overflow: hidden;
	box-shadow: 0 3px 0 rgba(0,0,0,.15);
}
#bar i { display: block; height: 100%; width: 0%; background: repeating-linear-gradient(-45deg, #f6c75c 0 10px, #f2b844 10px 20px); border-radius: 0 8px 8px 0; transition: width .2s; float: right; }
#status { margin: 0; font-size: clamp(16px, 3vmin, 24px); font-weight: 700; color: var(--ink); min-height: 1.4em; text-align: center; }
#start {
	display: none;
	font: inherit; font-size: clamp(24px, 5vmin, 40px); font-weight: 800;
	color: #fdeccf; background: none;
	/* G-19: the owner's wooden button (icons/ui_button.png, 6 px corners) — the same piece the in-game panels use */
	border: 0 solid transparent; border-width: var(--bw, 18px);
	border-image: url(icons/ui_button.png) 6 fill / var(--bw, 18px) stretch;
	image-rendering: pixelated; image-rendering: crisp-edges;
	padding: 0 .9em .1em;
	min-width: 6.5em;
	text-shadow: 0 2px 0 #6e3f29, 2px 0 0 #6e3f29, -2px 0 0 #6e3f29, 0 -2px 0 #6e3f29;
	filter: drop-shadow(0 6px 10px rgba(19, 40, 44, .28));
	cursor: pointer; touch-action: manipulation;
	animation: bob 1.6s ease-in-out infinite;
}
#start:hover { filter: drop-shadow(0 6px 10px rgba(19, 40, 44, .28)) brightness(1.08); }
#start:focus { outline: none; }
#start:focus-visible { filter: drop-shadow(0 0 0 #ffd34d) drop-shadow(0 0 4px #ffd34d); }
#start:active { border-image-source: url(icons/ui_button_pressed.png); transform: translateY(3px); animation: none; }
@keyframes bob { 50% { transform: translateY(-4px); } }
#loader.ready #bar, #loader.ready .waves { display: none; }
#loader.ready #start { display: block; }
#notice { display: none; max-width: 80vw; background: var(--cream); border: 3px solid #c0705a; border-radius: 14px; padding: 12px 18px; font-size: 18px; line-height: 1.5; text-align: center; white-space: pre-line; }
#loader.error #notice { display: block; }
/* G-01: which build this is (faint, bottom corner) + the "new version" banner */
#build { position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: max(6px, env(safe-area-inset-bottom)); margin: 0;
	font-size: 12px; font-weight: 600; color: rgba(19, 40, 44, .55); background: rgba(253, 236, 207, .45); border-radius: 6px; padding: 1px 8px; direction: rtl; }
#updating { display: none; position: fixed; z-index: 30; top: 12px; left: 50%; transform: translateX(-50%); background: #fdeccf;
	color: var(--ink); border: 3px solid #9a522d; border-radius: 12px; padding: 6px 16px; font-size: 18px; font-weight: 700; }
#updating.on { display: block; }
#loader.error #bar, #loader.error #start, #loader.error .waves { display: none; }

/* ---------- portrait overlay (touch devices only) ---------- */
#rotate {
	display: none; position: fixed; inset: 0; z-index: 20;
	background: var(--sea); color: var(--ink);
	flex-direction: column; align-items: center; justify-content: center; gap: 24px;
	font-size: clamp(20px, 5vw, 30px); font-weight: 800; text-align: center;
}
#rotate .tab { width: 60px; height: 92px; border: 6px solid var(--wood-dark); border-radius: 12px; background: var(--cream); animation: turn 2.2s ease-in-out infinite; }
@keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (hover: none) and (pointer: coarse) {
	#rotate { display: flex; }
}

/* ---------- hotfix: tap feedback, problem card, diagnostics ---------- */
#loader.starting #bar, #loader.starting .waves { display: none; }
#loader.starting #start { display: block; animation: none; pointer-events: none; border-image-source: url(icons/ui_button_pressed.png); filter: saturate(.75) brightness(.97) drop-shadow(0 4px 8px rgba(19, 40, 44, .25)); transform: translateY(3px); }
#spinner { display: none; gap: 14px; height: 26px; align-items: center; justify-content: center; }
#loader.starting #spinner { display: flex; }
#spinner i { display: block; width: 16px; height: 16px; border-radius: 50%; background: #f2b844; border: 3px solid var(--wood-dark); box-sizing: border-box; animation: hop 1.1s ease-in-out infinite; }
#spinner i:nth-child(2) { animation-delay: .18s; }
#spinner i:nth-child(3) { animation-delay: .36s; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-12px); } }
#problem { display: none; position: fixed; inset: 0; z-index: 40; align-items: center; justify-content: center; flex-direction: column; gap: 20px; padding: 20px;
	background: rgba(155, 212, 195, .96); color: var(--ink); text-align: center; box-sizing: border-box; }
#problem.on { display: flex; }
#problem h2 { margin: 0; font-size: clamp(24px, 5vmin, 38px); font-weight: 800; color: var(--wood-dark); }
#problem p { margin: 0; max-width: 34em; font-size: clamp(18px, 3.4vmin, 26px); line-height: 1.55; font-weight: 700; }
#problem .row { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
#problem button { font: inherit; font-size: clamp(22px, 4.4vmin, 34px); font-weight: 800; min-width: 7em; min-height: 64px; padding: 10px 22px; border-radius: 18px;
	border: 4px solid var(--wood-dark); color: #fdeccf; background: var(--wood); box-shadow: 0 5px 0 var(--wood-dark); cursor: pointer; touch-action: manipulation; }
#problem button.alt { background: var(--leaf); }
#problem button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--wood-dark); }
#pbuild { margin: 0; font-size: 13px; color: rgba(19, 40, 44, .6); padding: 6px 14px; }
#diag { display: none; position: fixed; inset: 0; z-index: 50; background: #17252a; color: #d7efe6; box-sizing: border-box; padding: max(12px, env(safe-area-inset-top)) 14px 14px;
	font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; direction: ltr; text-align: left; overflow: auto; touch-action: pan-y; -webkit-user-select: text; user-select: text; }
#diag.on { display: block; }
#diag pre { margin: 0 0 12px; white-space: pre-wrap; word-break: break-all; }
#diag button { font: 700 18px/1 sans-serif; min-height: 48px; padding: 8px 20px; margin: 0 10px 12px 0; border-radius: 10px; border: 0; background: #f2b844; color: #3a2a1c; }
#diag h3 { margin: 8px 0 4px; color: #f2b844; font-size: 14px; }
#updating.note { top: auto; bottom: 14px; font-size: 16px; pointer-events: none; }
#build { pointer-events: auto; padding: 10px 18px; margin: -10px -18px; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0">Your browser does not support the canvas tag.</canvas></div>

<div id="loader">
	<div id="artwrap" aria-hidden="true"><img id="art" alt=""><div id="parade"></div></div>
	<div class="island" aria-hidden="true"><div class="sun"></div><div class="sand"></div><div class="grass"></div><div class="trunk"></div><div class="leaves"></div></div>
	<h1>جزيرة العائلة</h1>
	<div class="waves" aria-hidden="true"></div>
	<div class="bottom" style="display:contents">
	<div id="bar"><i></i></div>
	<p id="status">نجهّز الجزيرة…</p>
	<button id="start" type="button">ابدأ اللعب</button>
		<div id="spinner" aria-hidden="true"><i></i><i></i><i></i></div>
	<div id="notice"></div>
	</div>
	<p id="build"></p>
</div>
<div id="updating">نسخة جديدة من الجزيرة… لحظة</div>
<div id="problem" role="alert"><h2 id="ptitle"></h2><p id="ptext"></p>
	<div class="row"><button id="pretry" type="button">حاول مرة أخرى</button><button id="plite" type="button" class="alt">تشغيل خفيف</button></div>
	<p id="pbuild"></p></div>
<div id="diag"><button id="diagclose" type="button">إغلاق · Close</button><button id="diagcopy" type="button">نسخ · Copy</button><div id="diagbody"></div></div>
<script>
/* G-19 loading art + parade, G-01 build stamp. Runs before the engine script so the picture shows at once. */
const FI_BUILD = {"time": 1792487442, "commit": "c7974ae", "build": "0ff6add7285c"};
(function () {
	const loader = document.getElementById('loader');
	const art = document.getElementById('art');
	const parade = document.getElementById('parade');
	let iw = 0, ih = 0, scale = 1;
	/* Whole device pixels per art pixel: the cover scale rounded DOWN when that still fills at least 90 % of the
	   screen (the gap shows the picture's own sky / sand colour), else rounded up (a little is cropped). */
	function fitArt() {
		if (!iw) return;
		const dpr = window.devicePixelRatio || 1;
		const W = window.innerWidth * dpr, H = window.innerHeight * dpr;
		const c = Math.max(W / iw, H / ih);
		let s = Math.floor(c);
		if (s < 1 || s * Math.min(iw / W, ih / H) < 0.9) s = Math.ceil(c);
		scale = s;
		art.style.width = (iw * s / dpr) + 'px';
		art.style.height = (ih * s / dpr) + 'px';
		art.style.left = (Math.round((W - iw * s) / 2) / dpr) + 'px';
		art.style.top = (Math.round((H - ih * s) / 2) / dpr) + 'px';
		// feet on the beach: 93 % down the hi-res picture (its bottom sixth is an empty sand strip), never below the screen
		const feet = Math.min((H - ih * s) / 2 + ih * s * (iw >= 960 ? 0.93 : 0.97), H - 8 * dpr);
		parade.style.top = (Math.round(feet) / dpr) + 'px';
		buildParade(s * (iw >= 960 ? 2 : 1) / dpr);   // one game pixel = 2 art pixels of the 960-wide picture
	}
	/* sheet: url, cell px, row, frames, flip (sheets whose side row faces the wrong way) */
	const TROOP = [
		{ src: 'icons/walk_girl.png', cell: 64, row: 5, n: 4, fps: 6, flip: false, gap: 0 },
		{ src: 'icons/walk_boy.png', cell: 64, row: 5, n: 4, fps: 6, flip: false, gap: 22 },
		{ src: 'icons/walk_dog.png', cell: 32, row: 1, n: 3, from: 1, fps: 7, flip: false, gap: 26, lift: 2 },
		{ src: 'icons/walk_chicken.png', cell: 16, row: 1, n: 3, from: 1, fps: 7, flip: false, gap: 40, lift: 1 },
		{ src: 'icons/walk_chick.png', cell: 16, row: 1, n: 3, from: 1, fps: 8, flip: false, gap: 12, lift: 1 },
	];
	let builtFor = 0;
	function buildParade(px) {
		if (px === builtFor) return;
		builtFor = px;
		parade.innerHTML = '';
		const troop = document.createElement('div');
		troop.className = 'troop';
		let x = 0;
		const css = [];
		TROOP.forEach(function (t, i) {
			x += t.gap * px;
			const d = document.createElement('div');
			const w = t.cell * px, from = (t.from || 0) * w;
			d.className = 'walker' + (t.flip ? ' flip' : '');
			d.style.width = w + 'px';
			d.style.height = t.cell * px + 'px';
			d.style.left = x + 'px';
			d.style.bottom = (-(t.cell === 64 ? 8 : t.lift || 0) * px) + 'px';   // 64-cells: feet at y=56
			d.style.backgroundImage = 'url(' + t.src + ')';
			d.style.setProperty('--n', t.n);
			d.style.setProperty('--steps', 'fiw' + i + ' ' + (t.n / t.fps) + 's');
			const img = new Image();
			img.onload = function () {
				d.style.backgroundSize = (img.width * px) + 'px ' + (img.height * px) + 'px';
			};
			img.src = t.src;
			const y = -t.row * t.cell * px;
			css.push('@keyframes fiw' + i + ' { from { background-position: ' + (-from) + 'px ' + y + 'px; } to { background-position: ' + (-from - t.n * w) + 'px ' + y + 'px; } }');
			troop.appendChild(d);
			x += w;
		});
		troop.style.width = x + 'px';
		let st = document.getElementById('fiw-style');
		if (!st) { st = document.createElement('style'); st.id = 'fiw-style'; document.head.appendChild(st); }
		st.textContent = css.join('\n');
		parade.appendChild(troop);
	}
	function edgeColours(img) {
		try {
			const c = document.createElement('canvas'); c.width = 1; c.height = img.naturalHeight;
			const g = c.getContext('2d'); g.drawImage(img, 0, 0, 1, img.naturalHeight);
			const px = function (y) { const d = g.getImageData(0, y, 1, 1).data; return 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')'; };
			loader.style.setProperty('--art-top', px(1));
			loader.style.setProperty('--art-bottom', px(img.naturalHeight - 2));
		} catch (e) { /* tainted / no canvas: keep the defaults */ }
	}
	function show(src, fallback) {
		art.onload = function () {
			iw = art.naturalWidth; ih = art.naturalHeight;
			edgeColours(art);
			loader.classList.add('art');
			loader.querySelector('.bottom').style.display = '';
			fitArt();
		};
		art.onerror = function () { if (fallback) show(fallback, null); };
		art.src = src;
	}
	show('icons/loading_hd.png', 'icons/loading.png');
	window.addEventListener('resize', fitArt);
	/* the start button's wooden frame: 3 device pixels per art pixel of the 6 px corner, like the in-game buttons */
	function fitButton() { document.documentElement.style.setProperty('--bw', (6 * Math.max(2, Math.round(3 * (window.devicePixelRatio || 1))) / (window.devicePixelRatio || 1)) + 'px'); }
	fitButton();
	window.addEventListener('resize', fitButton);
	/* G-01: "نسخة ١٠ أكتوبر، ٣:٤٠ م" — the same stamp Settings shows inside the game */
	try {
		const b = document.getElementById('build');
		if (FI_BUILD && FI_BUILD.time) {
			const d = new Date(FI_BUILD.time * 1000);
			b.textContent = 'نسخة ' + d.toLocaleString('ar', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', hour12: true });
			b.title = FI_BUILD.build || '';
		}

		const add = function (k, v) { L.push(k + ': ' + v); };
		add('build', JSON.stringify(fiWeb.build));
		add('ua', navigator.userAgent);
		add('screen', screen.width + 'x' + screen.height + ' dpr ' + window.devicePixelRatio + ' inner ' + innerWidth + 'x' + innerHeight);
		add('canvas', canvas.width + 'x' + canvas.height + ' (' + (canvas.width * canvas.height / 1e6).toFixed(2) + ' Mpx)');
		add('mobile', fiWeb.isMobile + '  lite ' + fiWeb.isLite() + '  low_quality ' + fiWeb.isLowQuality() + '  cap ' + fiWeb.AUTO_CAPS[fiWeb.autoLevel()] + '  autoLevel ' + fiWeb.autoLevel() + ' locked ' + fiWeb.autoLocked() + ' ' + JSON.stringify(fiWeb.auto.history));
		add('device', 'memory ' + (navigator.deviceMemory || '?') + ' GB, cores ' + (navigator.hardwareConcurrency || '?') + ', touch ' + navigator.maxTouchPoints);
		add('sw', 'secure ' + window.isSecureContext + ', controller ' + !!(navigator.serviceWorker && navigator.serviceWorker.controller) + ', phase ' + (D && D.phase) + ', problem ' + (problemKind || '-'));
		try {
			const c = document.createElement('canvas'), g = c.getContext('webgl2') || c.getContext('webgl');
			const x = g && g.getExtension('WEBGL_debug_renderer_info');
			add('webgl', g ? (x ? g.getParameter(x.UNMASKED_RENDERER_WEBGL) : 'yes') + ' maxTex ' + g.getParameter(g.MAX_TEXTURE_SIZE) : 'NONE');
		} catch (e) { add('webgl', 'error ' + e); }
		add('marks (ms)', JSON.stringify(D ? D.marks : {}));
		L.push('', '--- errors / warnings (last 30) ---');
		L.push.apply(L, D && D.errs.length ? D.errs : ['(none)']);
		L.push('', '--- console (last 30) ---');
		L.push.apply(L, D && D.all.length ? D.all : ['(none)']);
		return L.join('\n');
	}
	const diagEl = document.getElementById('diag');
	function openDiag() {
		let pre = document.getElementById('diagpre');
		if (!pre) { pre = document.createElement('pre'); pre.id = 'diagpre'; document.getElementById('diagbody').appendChild(pre); }
		pre.textContent = diagText();
		diagEl.classList.add('on');
	}
	document.getElementById('diagclose').addEventListener('click', function () { diagEl.classList.remove('on'); });
	document.getElementById('diagcopy').addEventListener('click', function () {
		try { navigator.clipboard.writeText(diagText()); } catch (e) { /* the text is selectable anyway */ }
	});
	function bindStamp(el) {
		let n = 0, first = 0, last = 0;
		function tap() {
			const now = Date.now();
			if (now - last < 80) return;   // pointerup + click of the same tap
			last = now;
			if (now - first > 4000) { n = 0; first = now; }
			if (++n >= 5) { n = 0; openDiag(); }
		}
		el.addEventListener('pointerup', tap);
		el.addEventListener('click', tap);
	}
	const stampEl = document.getElementById('build'), pstamp = document.getElementById('pbuild');
	pstamp.textContent = stampEl.textContent;
	bindStamp(stampEl); bindStamp(pstamp);
	window.fiWeb.openDiag = openDiag;
}());
</script>
