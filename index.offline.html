<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جزيرة العائلة</title>
<style>
html, body { margin: 0; height: 100%; background: #9bd4c3; color: #4a3426;
	font-family: "SF Arabic Rounded", "SF Arabic", "Geeza Pro", "Noto Sans Arabic", Tahoma, sans-serif; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; box-sizing: border-box; }
h1 { margin: 0; font-size: 34px; color: #fff8e8; text-shadow: 0 3px 0 #6b4329; }
p { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.6; }
button { font: inherit; font-size: 22px; font-weight: 800; color: #fff8e8; background: #5aa152; border: 4px solid #3d7a37; border-radius: 18px; padding: 8px 28px; }
</style>
</head>
<body>
<h1>جزيرة العائلة</h1>
<p>نحتاج الإنترنت مرّةً واحدةً فقط لتنزيل الجزيرة.<br>بعدها تعمل اللعبة بلا إنترنت.</p>
<button type="button" onclick="location.reload()">حاول مرّة أخرى</button>
</body>
</html>
